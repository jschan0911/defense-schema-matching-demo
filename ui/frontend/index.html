<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCHEMORA C2 실증</title>
    <meta
      name="description"
      content="화면에서 복구한 합성 C2 데이터와 실제 SCHEMORA 링크 후보를 비교·검토하는 실증 UI"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="SCHEMORA Case Lab 홈">
        <span class="brand-mark">S</span>
        <span><b>SCHEMORA</b><small>C2 DEMO LAB</small></span>
      </a>
      <div class="topbar-copy">
        <strong>스키마 링크 검토 워크벤치</strong>
        <span>공개·합성 메타데이터 전용</span>
      </div>
      <div class="security-label">비운용 데이터</div>
    </header>

    <nav class="case-strip" aria-label="실증 범위">
      <div id="case-tabs" class="case-tabs"></div>
    </nav>

    <section class="case-brief">
      <div>
        <p id="case-kind" class="eyebrow"></p>
        <h1 id="case-title">케이스 불러오는 중</h1>
        <p id="case-description"></p>
      </div>
      <div class="brief-actions">
        <button id="open-datasets" class="secondary">데이터셋 보기</button>
        <button id="reload">추천 다시 불러오기</button>
      </div>
    </section>

    <div class="workspace">
      <aside class="rail">
        <p class="rail-title">SCAN SUMMARY</p>
        <div class="review-count"><strong id="pending-count">0</strong><span id="total-count">/ 0</span></div>
        <p id="summary-label" class="muted">검토 대기</p>
        <div id="decision-counts" class="decision-counts"></div>

        <div class="filter-block">
          <h2>상태 필터</h2>
          <label class="sr-only" for="status">상태</label>
          <select id="status">
            <option value="all">전체</option>
            <option value="pending">대기 중</option>
            <option value="approved">승인됨</option>
            <option value="ignored">무시됨</option>
          </select>
        </div>

        <div class="filter-block">
          <h2>검색</h2>
          <label class="sr-only" for="search">추천 링크 검색</label>
          <input id="search" type="search" placeholder="필드 또는 설명" />
        </div>

        <div class="scope-note">
          <span>평가 상태</span>
          <strong id="case-status">—</strong>
          <p id="result-note"></p>
        </div>
      </aside>

      <main>
        <div class="recommendation-toolbar">
          <div>
            <p class="eyebrow">LINK RECOMMENDATIONS</p>
            <strong id="shown-count">0건 표시</strong>
          </div>
          <div id="result-mode" class="result-mode" hidden>
            <button data-mode="reference" class="active">Reference · 관찰값</button>
            <button data-mode="schemora">SCHEMORA 결과</button>
          </div>
          <div class="bulk">
            <span id="selected-count">0건 선택</span>
            <button id="approve-selected">선택 승인</button>
            <button id="ignore-selected" class="secondary">선택 무시</button>
          </div>
        </div>
        <div id="notice" role="status"></div>
        <section id="score-guide" class="score-guide" aria-live="polite">
          <div>
            <span id="score-guide-kicker"></span>
            <strong id="score-guide-title"></strong>
          </div>
          <ul id="score-guide-points"></ul>
        </section>
        <div id="empty" class="empty" hidden></div>
        <div class="table-shell">
          <div class="table-head" aria-hidden="true">
            <span></span><span>표시 점수</span><span>From</span><span>링크</span><span>To</span><span>표시 등급</span><span>추천 근거</span><span>액션</span>
          </div>
          <div id="rows" class="rows"></div>
        </div>
      </main>
    </div>

    <template id="row-template">
      <article class="link-row">
        <input class="select-row" type="checkbox" aria-label="추천 선택" />
        <div class="score">
          <strong></strong>
          <small></small>
        </div>
        <div class="endpoint from">
          <strong></strong>
          <span></span>
        </div>
        <div class="link-name">
          <strong></strong>
          <span>↗ 링크</span>
        </div>
        <div class="endpoint to">
          <strong></strong>
          <span></span>
        </div>
        <span class="grade"></span>
        <details class="reason">
          <summary></summary>
          <div class="evidence">
            <p class="explanation"></p>
            <p><b>Source</b><span class="source-definition"></span></p>
            <p><b>Target</b><span class="target-definition"></span></p>
            <p class="raw-scores"></p>
          </div>
        </details>
        <div class="actions">
          <button class="ignore secondary" title="이 추천을 무시">무시</button>
          <button class="approve" title="이 추천을 승인">승인</button>
          <button class="pending ghost" title="검토 대기로 되돌리기">되돌림</button>
        </div>
      </article>
    </template>

    <dialog id="dataset-dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">CASE DATA</p>
          <h2 id="dataset-title">데이터셋 미리보기</h2>
        </div>
        <button id="close-datasets" class="secondary" aria-label="닫기">닫기</button>
      </div>
      <p id="dataset-notice" class="dataset-notice"></p>
      <div id="dataset-tabs" class="dataset-tabs" role="tablist"></div>
      <div id="dataset-content"></div>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
